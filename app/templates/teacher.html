<div id="teacher-dashboard">
    <h2>Teacher Dashboard</h2>
    <div id="create-assignment-form">
        <h3>Create Assignment</h3>
        <form id="assignment-form">
            <input type="text" id="assignment-title" placeholder="Title" required>
            <textarea id="assignment-description" placeholder="Description" required></textarea>
            <button type="submit">Create</button>
        </form>
    </div>
    <div id="assignments-list">
        <h3>Assignments</h3>
        <ul id="assignments">
            <!-- Assignments will be loaded here -->
        </ul>
    </div>
    <div id="submissions-list" style="display: none;">
        <h3>Submissions</h3>
        <ul id="submissions">
            <!-- Submissions will be loaded here -->
        </ul>
    </div>
</div>
